# Starting point for a Flathub submission — UNVERIFIED, see docs/06-distribuicao.md.
# Electron apps on Flathub build on org.electronjs.Electron2.BaseApp, which
# bundles "zypak" so Electron's own sandbox works inside Flatpak's sandbox.
#
# This manifest expects a built .deb (from `npm run dist:linux`) to extract the
# app files from — adjust `sources` to point at a real release asset URL + sha256
# before actually submitting. Test locally with:
#   flatpak-builder --user --install --force-clean build-dir flatpak/com.rglodzinski.limpatudo.yml
app-id: com.rglodzinski.limpatudo
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "23.08"
command: limpa-tudo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: limpa-tudo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/limpa-tudo
      - cp -a . /app/limpa-tudo
      - mkdir -p /app/bin
      - ln -s /app/limpa-tudo/limpa-tudo /app/bin/limpa-tudo
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/com.rglodzinski.limpatudo.png
      - install -Dm644 com.rglodzinski.limpatudo.desktop /app/share/applications/com.rglodzinski.limpatudo.desktop
      - install -Dm644 com.rglodzinski.limpatudo.metainfo.xml /app/share/metainfo/com.rglodzinski.limpatudo.metainfo.xml
    sources:
      - type: file
        path: com.rglodzinski.limpatudo.desktop
      - type: file
        path: com.rglodzinski.limpatudo.metainfo.xml
      # tar.gz da release (atualizar url + sha256 a cada versão; o sha256 está
      # no campo `digest` da API de releases — ver packaging/update-packages.mjs).
      - type: archive
        url: https://github.com/rglodzinski/LimpaTudo/releases/download/v1.4.0/Limpa.Tudo-1.4.0-x64.tar.gz
        sha256: cb056723c8bc114bc6fb05e2da743c53b309f69bcac24136068175ece9875a7b
