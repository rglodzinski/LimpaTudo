name: Pages

# Gera o site (site/build.mjs → dist-site/) e publica no GitHub Pages.
# Os links de download, as novidades e o sitemap são gerados no build, em HTML
# estático, por isso o site é republicado a cada release: o job `release` do
# build.yml dispara este workflow (eventos de release criados com o
# GITHUB_TOKEN não disparam outros workflows sozinhos).
#
# Endereço público: variável de repositório SITE_URL (ex.:
# https://limpatudo.glodzinski.dev.br). Sem ela, usa o github.io. Ver
# docs/09-divulgacao-organica.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/lib/changelog.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

# Build e deploy em jobs separados (como no workflow oficial do Pages): no
# mesmo job, o deploy-pages consultava o artefato menos de 1 s depois do
# upload e às vezes recebia "No artifacts named github-pages were found".
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
