name: Flatpak

# Testa o manifesto do Flathub (flatpak/) num Linux x86_64 de verdade: build,
# instalação e flatpak-builder-lint. Não publica nada. Rodar à mão ou quando
# o manifesto mudar. Ver docs/06-distribuicao.md e packaging/README.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["flatpak/**", ".github/workflows/flatpak.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo --force-clean --default-branch=stable build-dir flatpak/com.rglodzinski.limpatudo.yml
          flatpak build-bundle repo limpa-tudo.flatpak com.rglodzinski.limpatudo stable
          ls -la build-dir/files/bin build-dir/files/share/applications build-dir/files/share/metainfo
      - name: Lint (flatpak-builder-lint)
        run: |
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          lint() { flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@" || echo "::warning::lint $1 reported issues"; }
          lint manifest flatpak/com.rglodzinski.limpatudo.yml
          lint appstream flatpak/com.rglodzinski.limpatudo.metainfo.xml
          lint builddir build-dir
      - uses: actions/upload-artifact@v4
        with:
          name: limpa-tudo-flatpak
          path: limpa-tudo.flatpak
