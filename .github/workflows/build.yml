name: Build

# Runs on PRs and on demand (build only, no signing/publishing), and produces
# signed+notarized/published artifacts when a `v*` tag is pushed. Pushes to
# main no longer build: they published nothing and the macOS job kept being
# cancelled waiting for a runner. If a release build fails here, build the
# installers locally (`npm run dist:mac`, `npm run dist:linux`) and upload them
# with `gh release upload`.
# See docs/06-distribuicao.md for everything this pipeline does NOT yet do
# (Mac App Store, Snap Store, Flathub submissions) and why.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (Intel + Apple Silicon)
    runs-on: macos-15
    # Public values shown in the About screen and the Pix QR (the key is
    # public in any QR anyway), so they are repository variables, not secrets.
    env:
      VITE_APP_WEBSITE: ${{ vars.VITE_APP_WEBSITE }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_PIX_KEY: ${{ vars.VITE_PIX_KEY }}
      VITE_PIX_MERCHANT_NAME: ${{ vars.VITE_PIX_MERCHANT_NAME }}
      VITE_PIX_MERCHANT_CITY: ${{ vars.VITE_PIX_MERCHANT_CITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build unsigned (PR / push to main)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:mac
      - name: Build signed + notarized (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac:signed
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage, deb, rpm, snap)
    runs-on: ubuntu-latest
    # Public values shown in the About screen and the Pix QR (the key is
    # public in any QR anyway), so they are repository variables, not secrets.
    env:
      VITE_APP_WEBSITE: ${{ vars.VITE_APP_WEBSITE }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_PIX_KEY: ${{ vars.VITE_PIX_KEY }}
      VITE_PIX_MERCHANT_NAME: ${{ vars.VITE_PIX_MERCHANT_NAME }}
      VITE_PIX_MERCHANT_CITY: ${{ vars.VITE_PIX_MERCHANT_CITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # rpmbuild + snapcraft's build deps aren't on the default runner image.
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo snap install snapcraft --classic
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.snap
            release/*.tar.gz
          if-no-files-found: error
      # Snap Store: só roda numa tag e quando o secret existir (ver
      # docs/06-distribuicao.md, seção 3, para criar a conta e o secret).
      - name: Publish to Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true # falha na loja não pode impedir a release no GitHub
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS não configurado — pulando a publicação na Snap Store."
            exit 0
          fi
          for f in release/*.snap; do snapcraft upload "$f" --release=stable; done

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # para disparar o pages.yml
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
      # Republica o site com os links da nova versão (o evento de release
      # criado com GITHUB_TOKEN não dispara outros workflows).
      - name: Rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
