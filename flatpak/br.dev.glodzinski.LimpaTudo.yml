# Manifesto do Flathub — ver docs/06-distribuicao.md e packaging/README.md.
# Apps Electron no Flathub usam o org.electronjs.Electron2.BaseApp, que traz o
# zypak para o sandbox do Electron funcionar dentro do sandbox do Flatpak.
#
# Usa o .tar.gz da release (url + sha256 a atualizar a cada versão; o sha256
# está no `digest` da API de releases). Testar localmente com:
#   flatpak-builder --user --install --install-deps-from=flathub --force-clean \
#     build-dir flatpak/br.dev.glodzinski.LimpaTudo.yml
app-id: br.dev.glodzinski.LimpaTudo
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: limpa-tudo
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: limpa-tudo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/limpa-tudo
      - cp -a app/. /app/limpa-tudo/
      - install -Dm755 limpa-tudo.sh /app/bin/limpa-tudo
      - install -Dm644 logo-mark.svg /app/share/icons/hicolor/scalable/apps/br.dev.glodzinski.LimpaTudo.svg
      - install -Dm644 br.dev.glodzinski.LimpaTudo.desktop /app/share/applications/br.dev.glodzinski.LimpaTudo.desktop
      - install -Dm644 br.dev.glodzinski.LimpaTudo.metainfo.xml /app/share/metainfo/br.dev.glodzinski.LimpaTudo.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/rglodzinski/LimpaTudo/releases/download/v1.4.0/Limpa.Tudo-1.4.0-x64.tar.gz
        sha256: cb056723c8bc114bc6fb05e2da743c53b309f69bcac24136068175ece9875a7b
        dest: app
      - type: file
        url: https://raw.githubusercontent.com/rglodzinski/LimpaTudo/v1.4.0/site/logo-mark.svg
        sha256: 9703e9f3c61f359943fefdc230ec1e9f17cb9043000cc197f614842a030c625a
      - type: file
        path: br.dev.glodzinski.LimpaTudo.desktop
      - type: file
        path: br.dev.glodzinski.LimpaTudo.metainfo.xml
      - type: script
        dest-filename: limpa-tudo.sh
        commands:
          - exec zypak-wrapper /app/limpa-tudo/limpa-tudo "$@"
